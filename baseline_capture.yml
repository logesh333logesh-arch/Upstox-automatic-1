name: Scanner2 - Baseline Capture

# Market open (9:15 AM IST) ஆன 1 நிமிடம் கழிச்சு run ஆகும்
# IST = UTC + 5:30, அதனால 9:16 AM IST = 3:46 AM UTC
on:
  schedule:
    - cron: "46 3 * * 1-5"   # Mon-Fri மட்டும்
  workflow_dispatch: {}       # Manual-ஆவும் run பண்ணலாம்

jobs:
  capture-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install
        run: pip install -r requirements.txt

      - name: Baseline capture run
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python baseline_capture.py

      - name: Baseline file commit பண்ணு (next steps-க்கு persist ஆக வேணும்)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add baseline_premiums.json
          git commit -m "Baseline premiums update - $(date)" || echo "No changes"
          git push
